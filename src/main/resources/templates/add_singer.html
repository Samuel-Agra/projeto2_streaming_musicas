<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Projeto2: Add Singer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
<div class="container mt-4">
  <h2>Add New Singer</h2>

  <form th:action="@{/singers/add}" method="post" th:object="${singer}" class="needs-validation">
    <!-- Global Error Alert -->
    <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
      Please fix the errors below and try again.
    </div>

    <!-- Singer First Name Field -->
    <div class="mb-3">
      <label class="form-label">First Name</label>
      <input type="text" class="form-control"
             th:field="*{firstName}"
             th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : (${singer.firstName != null} ? 'is-valid' : '')"
             required>
      <!-- Error message for invalid input -->
      <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
      <!-- Valid feedback for correct input -->
      <div class="valid-feedback" th:unless="${#fields.hasErrors('firstName')}" th:if="${singer.firstName != null}">Looks good!</div>
    </div>
    <!-- Singer Last Name Field -->
    <div class="mb-3">
      <label class="form-label">Last Name</label>
      <input type="text" class="form-control"
             th:field="*{lastName}"
             th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : (${singer.lastName != null} ? 'is-valid' : '')"
             required>
      <!-- Error message for invalid input -->
      <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
      <!-- Valid feedback for correct input -->
      <div class="valid-feedback" th:unless="${#fields.hasErrors('lastName')}" th:if="${singer.lastName != null}">Looks good!</div>
    </div>
    <!-- Singer Birth Date Field -->
    <div class="mb-3">
      <label class="form-label">Birth Date</label>
      <input type="date" step="1" class="form-control"
             th:field="*{birthDate}"
             th:classappend="${#fields.hasErrors('birthDate')} ? 'is-invalid' : (${singer.birthDate != null} ? 'is-valid' : '')">
      <!-- Error message for invalid input -->
      <div class="invalid-feedback" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
      <!-- Valid feedback for correct input -->
      <div class="valid-feedback" th:unless="${#fields.hasErrors('birthDate')}" th:if="${singer.birthDate != null}">Looks good!</div>
    </div>
    <!-- Submit Button -->
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="/singers" class="btn btn-danger">Cancel</a>
  </form>
</div>
</body>

</html>

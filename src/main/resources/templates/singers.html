<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">

<head>
  <meta charset="UTF-8">
  <title>Projeto2: Singer List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
<div class="container mt-4">
  <h2 class="mb-4">Singer List</h2>

  <!-- roles displayed without brackets, and bold font -->
  <div sec:authorize="isAuthenticated()">
    <p>Welcome, <span sec:authentication="name"></span>!</p>
    <p>Your roles:
      <span th:each="role, iterStat : ${#authentication.authorities}">
                        <b th:text="${#strings.substringAfter(role.authority, 'ROLE_')}"></b>
                        <span th:if="${!iterStat.last}">, </span>
                    </span>
    </p>
  </div>

  <a href="/singers/add" class="btn btn-primary mb-3">Add New Singer</a>

  <!-- Visible Only to Authenticated Users -->
  <div sec:authorize="isAuthenticated()"  style="display:inline;">
    <form th:action="@{/logout}" method="post" style="display:inline;">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <button type="submit" class="btn btn-success mb-3">Logout</button>
    </form>
  </div>

  <table class="table table-striped">
    <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Birth Date</th>
      <th sec:authorize="isAuthenticated()">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="singer : ${singers}">
      <td th:text="${singer.id}"></td>
      <td>
        <span th:text="${singer.lastName}"></span>
        <span th:text="${singer.firstName}"></span>
      </td>
      <td th:text="${singer.birthDate}"></td>
      <td>
        <!-- Edit Button (Only for Admins) -->
        <a sec:authorize="hasRole('ADMIN')"
           th:href="@{/singers/edit/{id}(id=${singer.id})}"
           class="btn btn-warning btn-sm">Edit</a>
        <!-- Delete Button (Only for Admins) -->
        <a sec:authorize="hasRole('ADMIN')"
           th:href="@{/singers/delete/{id}(id=${singer.id})}"
           class="btn btn-danger btn-sm"
           onclick="return confirm('Are you sure you want to delete this singer?');">Delete</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Projeto2: Edit Singer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <h2>Edit Singer</h2>

  <form method="post" th:action="@{/singers/edit/{id}(id=${singer.id})}" th:object="${singer}">
    <!-- Global Error Alert -->
    <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
      Please fix the errors below and try again.
    </div>

    <input th:field="*{id}" type="hidden"/>  <!-- Keep ID hidden (not editable) -->

    <!-- Singer First Name Input -->
    <div class="mb-3">
      <label class="form-label">Fist Name</label>
      <label>
        <input type="text" class="form-control"
               th:field="*{firstName}"
               th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : (${singer.firstName != null and !singer.firstName.isBlank()} ? 'is-valid' : '')"
               required>
      </label>
      <!-- Error message for invalid input -->
      <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
      <!-- Valid feedback when there are no errors and the field is filled -->
      <div class="valid-feedback" th:if="${not #fields.hasErrors('firstName') and singer.firstName != null}">Looks good!</div>
    </div>

    <!-- Singer Last Name Input -->
    <div class="mb-3">
      <label class="form-label">Last Name</label>
      <label>
        <input type="text" class="form-control"
               th:field="*{lastName}"
               th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : (${singer.lastName != null and !singer.lastName.isBlank()} ? 'is-valid' : '')"
               required>
      </label>
      <!-- Error message for invalid input -->
      <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
      <!-- Valid feedback when there are no errors and the field is filled -->
      <div class="valid-feedback" th:if="${not #fields.hasErrors('lastName') and singer.lastName != null}">Looks good!</div>
    </div>

    <!-- Singer Birth Date Field -->
    <div class="mb-3">
      <label class="form-label">Birth Date</label>
      <label>
        <input type="date" step="1" class="form-control"
               th:field="*{birthDate}"
               th:classappend="${#fields.hasErrors('birthDate')} ? 'is-invalid' : (${singer.birthDate != null} ? 'is-valid' : '')">
      </label>
      <!-- invalid format -->
      <div class="invalid-feedback"
           th:if="${#fields.hasErrors('birthDate')}"
           th:errors="*{birthDate}">Invalid Format</div>
      <!-- Valid feedback for correct input -->
      <div class="valid-feedback" th:unless="${#fields.hasErrors('birthDate')}" th:if="${singer.birthDate != null}">Looks good!</div>
    </div>

    <!-- Submit Button -->
    <button class="btn btn-success" type="submit">Save Changes</button>
    <a class="btn btn-danger" th:href="@{/singers}">Cancel</a>
  </form>
</div>

</body>
</html>
